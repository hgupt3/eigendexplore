benchmark: dextreme
hands: [allegro]
num_envs: 16384
play_num_envs: 1024
# Play follows the paper's evaluation: ADR frozen at DR level -0.5 (nats per
# dimension), the action EMA where its schedule ends at 2B frames, and at most
# 30 consecutive successes. action_delay_prob stays at its training range [0, 0].
