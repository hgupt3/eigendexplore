benchmark: simtoolreal
hands: [sharpa]
control_hz: 60.0
target_ema: 0.1
# Paper protocol: fixed 6 cm / 50 deg success tolerance for 9B frames, then the
# host curriculum tightens it toward 1 cm / 8 deg as the policy improves.
success_tolerance: 0.06
curriculum_start_frames: 9000000000
methods:
  joint_absolute: {}
  joint_delta: {joint_rate: 3.0}
  eigen_absolute: {}
  eigen_delta_joint_delta: {eigen_rate: 3.0, joint_rate: 3.0}
  joint_absolute_eigen_residual: {eigen_residual_fraction: 0.3}
  eigendexplore: {iid_sigma: 1.0, eigen_rms: 1.0, spectrum_power: 0.5}
